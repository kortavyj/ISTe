name: Validate Website PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Test tournament owner API security gates
        run: node --test tests/tournamentsOwnerEndpointsSecurity.test.js tests/tournamentsMatchConfirmIntegration.test.js

      - name: Build website
        run: npm run build

      - name: Validate direct routes
        run: node scripts/generate-static-routes.mjs

name: ISTe Tournaments CI
on:
  push:
    branches:
      - feature/cs2-tournaments-full-preview
  pull_request:
    paths:
      - 'src/**'
      - 'server/tournaments/**'
      - 'api/**'
      - 'tests/tournament-*.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tournaments-ci.yml'
jobs:
  tournament-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

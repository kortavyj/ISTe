name: Verify Tournaments V2 DEV Rollout Plan
on:
  pull_request:
    paths:
      - "supabase/rollout/tournaments-v2/**"
      - "tests/test_tournaments_v2_dev_rollout.py"
      - ".github/workflows/iste-tournaments-dev-rollout-plan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_tournaments_v2_dev_rollout.py -v

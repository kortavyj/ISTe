name: Update FACEIT statistics

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      full_match_sync:
        description: "Load the complete ISTe tournament match history"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load FACEIT data
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          FACEIT_FULL_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.full_match_sync && '1' || '0' }}
        run: node scripts/update-faceit-stats.mjs

      - name: Commit changed statistics
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- public/data/faceit-stats.json; then
            echo "FACEIT statistics have not changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/faceit-stats.json
          git commit -m "Update FACEIT statistics and team matches"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm install

      - name: Build website
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: needs.update.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

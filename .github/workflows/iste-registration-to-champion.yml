name: Verify Tournament V2 Registration to Champion
on:
  pull_request:
    paths:
      - "supabase/migrations/20261014_iste_tournament*.sql"
      - "supabase/migrations/20261014_iste_tournaments_v2_foundation.sql"
      - "tests/tournaments-v2-registration-to-champion.sql"
      - ".github/workflows/iste-registration-to-champion.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration-to-champion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: iste_e2e_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iste_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Run authenticated registration-to-champion SQL integration test
        shell: bash
        env:
          PGPASSWORD: disposable_only
        run: |
          set -euo pipefail
          for file in \
            tests/tournaments-v2-setup.sql \
            supabase/migrations/20261014_iste_tournaments_v2_foundation.sql \
            supabase/migrations/20261014_iste_tournament_team_apply_rpc.sql \
            supabase/migrations/20261014_iste_tournament_team_review_rpc.sql \
            supabase/migrations/20261014_iste_tournament_owner_list_teams_rpc.sql \
            supabase/migrations/20261014_iste_tournament_generate_bracket_rpc.sql \
            supabase/migrations/20261014_iste_tournament_confirm_match_rpc.sql \
            supabase/migrations/20261014_iste_tournament_owner_get_bracket_rpc.sql \
            tests/tournaments-v2-registration-to-champion.sql; do
            echo "Running: $file"
            docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" \
              -v "$PWD:/workspace:ro" postgres:17-alpine \
              psql -h 127.0.0.1 -U postgres -d iste_e2e_test \
              -X -v ON_ERROR_STOP=1 -f "/workspace/$file"
          done

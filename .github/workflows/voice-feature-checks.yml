name: Voice feature checks

on:
  pull_request:
    paths:
      - 'presence-worker/**'
      - 'supabase/functions/discord-interactions/**'
      - 'supabase/functions/discord-worker-runtime/**'
      - 'supabase/migrations/20261022_discord_voice_activity_reports_statuses.sql'
      - '.github/workflows/voice-feature-checks.yml'
  workflow_dispatch:

jobs:
  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check worker JavaScript syntax
        run: |
          node --check presence-worker/index.mjs
          node --check presence-worker/commands.mjs

  migration-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL syntax parser
        run: python -m pip install pglast==7.21
      - name: Parse voice migration SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          source = Path('supabase/migrations/20261022_discord_voice_activity_reports_statuses.sql').read_text()
          statements = parse_sql(source)
          assert statements and len(statements) >= 15, 'SQL statements missing'
          print(f'Parsed {len(statements)} statements')
          PY

  edge-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function TypeScript
        run: |
          deno check supabase/functions/discord-worker-runtime/index.ts
          deno check supabase/functions/discord-interactions/index.ts

name: Validate Tournament V2 Draft Inputs
on:
  pull_request:
    paths:
      - "api/lib/tournamentValidation.js"
      - "tests/tournamentValidation.test.js"
      - ".github/workflows/iste-tournament-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run draft validation unit tests
        run: node --test tests/tournamentValidation.test.js

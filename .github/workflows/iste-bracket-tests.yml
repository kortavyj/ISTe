name: Validate Tournament V2 Bracket Engine
on:
  pull_request:
    paths:
      - "api/lib/tournamentBracket.js"
      - "tests/tournamentBracket.test.js"
      - ".github/workflows/iste-bracket-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bracket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bracket unit tests
        run: node --test tests/tournamentBracket.test.js

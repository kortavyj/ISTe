name: Verify Tournament V2 Owner RPC

on:
  pull_request:
    paths:
      - "supabase/migrations/20261014_iste_tournaments_v2_foundation.sql"
      - "supabase/migrations/20261014_iste_tournament_owner_create_rpc.sql"
      - "tests/tournaments-v2-*.sql"
      - ".github/workflows/iste-tournament-rpc-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: iste_rpc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iste_rpc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated SQL migrations and authorization tests
        shell: bash
        env:
          PGPASSWORD: disposable_test_only
        run: |
          set -euo pipefail
          for file in \
            tests/tournaments-v2-setup.sql \
            supabase/migrations/20261014_iste_tournaments_v2_foundation.sql \
            supabase/migrations/20261014_iste_tournament_owner_create_rpc.sql \
            tests/tournaments-v2-create-rpc-fixture.sql; do
            echo "Executing: $file"
            docker run --rm --network host \
              -e PGPASSWORD="$PGPASSWORD" \
              -v "$PWD:/workspace:ro" postgres:17-alpine \
              psql --host=127.0.0.1 --username=postgres --dbname=iste_rpc_test \
              -X -v ON_ERROR_STOP=1 -f "/workspace/$file"
          done

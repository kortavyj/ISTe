name: Diagnose owner URL deprecation (Node 24)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/trace-owner-deprecation.mjs"
      - ".github/workflows/iste-owner-deprecation-diagnostics.yml"

permissions:
  contents: read

jobs:
  trace-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Exercise unauthenticated owner route with deprecation stack traces
        run: node --trace-deprecation scripts/trace-owner-deprecation.mjs

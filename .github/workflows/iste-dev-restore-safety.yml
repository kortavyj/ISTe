name: Verify ISTe DEV Restore Workflow Safety
on:
  pull_request:
    paths:
      - ".github/workflows/iste-verify-dev-backup-restore.yml"
      - ".github/workflows/iste-dev-restore-safety.yml"
      - "tests/test_iste_dev_restore_workflow.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Verify isolation and explicit manual trigger
        run: python -m unittest discover -s tests -p test_iste_dev_restore_workflow.py -v

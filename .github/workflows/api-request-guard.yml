name: API request guard tests

on:
  pull_request:
    paths:
      - "server/apiLib/requestGuard.js"
      - "tests/requestGuardBodySize.test.js"
      - ".github/workflows/api-request-guard.yml"
  push:
    branches: [main]
    paths:
      - "server/apiLib/requestGuard.js"
      - "tests/requestGuardBodySize.test.js"
      - ".github/workflows/api-request-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run request guard regression tests
        run: node --test tests/requestGuardBodySize.test.js

name: ISTe DEV Supabase encrypted backup (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iste-dev-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up DEV only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.ISTE_DEV_BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.ISTE_BACKUP_PASSPHRASE }}
      RCLONE_CONFIG_B64: ${{ secrets.ISTE_RCLONE_CONFIG_B64 }}
    steps:
      - name: Check credentials and enforce DEV identity
        shell: bash
        run: |
          set -euo pipefail
          for key in DATABASE_URL BACKUP_PASSPHRASE RCLONE_CONFIG_B64; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing secret: $key"
              exit 1
            fi
          done
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = os.environ["DATABASE_URL"]
          try:
              parsed = urlsplit(url)
              # Direct database host or Supabase pooler with project-scoped username.
              target = "jwzsawumiadlfxarvauc"
              host = (parsed.hostname or "").lower()
              username = parsed.username or ""
              identity_matches = host == f"db.{target}.supabase.co" or username.endswith(f".{target}")
              valid = (
                  parsed.scheme in ("postgres", "postgresql")
                  and identity_matches and bool(parsed.password)
                  and parsed.path == "/postgres"
                  and "sslmode=require" in parsed.query
              )
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("::error::DEV database URL does not identify the approved DEV project. No connection attempted.")
          print("Verified DEV project identity; no credential values printed.")
          PY

      - name: Install encryption and Drive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone gnupg

      - name: Prepare private credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/rclone.conf"
          printf '%s' "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          rclone --config "$RUNNER_TEMP/rclone.conf" listremotes | grep -Fx 'iste_drive:'

      - name: Export DEV and validate PostgreSQL archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" postgres:17-alpine \
            sh -c 'exec pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl' \
            > "$RUNNER_TEMP/iste-dev.dump"
          test -s "$RUNNER_TEMP/iste-dev.dump"
          docker run --rm -v "$RUNNER_TEMP:/backups:ro" postgres:17-alpine \
            pg_restore --list /backups/iste-dev.dump >/dev/null

      - name: Encrypt, decrypt and compare checksums
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          FILE="iste-dev-jwzsawumiadlfxarvauc-$(date -u +%Y%m%dT%H%M%SZ).dump.gpg"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
          gpg --batch --yes --pinentry-mode loopback --cipher-algo AES256 \
            --passphrase-file "$RUNNER_TEMP/passphrase" --symmetric \
            --output "$RUNNER_TEMP/$FILE" "$RUNNER_TEMP/iste-dev.dump"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/passphrase" \
            --decrypt "$RUNNER_TEMP/$FILE" 2>/dev/null | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/decrypted.sha"
          sha256sum "$RUNNER_TEMP/iste-dev.dump" | cut -d' ' -f1 > "$RUNNER_TEMP/source.sha"
          cmp "$RUNNER_TEMP/source.sha" "$RUNNER_TEMP/decrypted.sha"
          rm -f "$RUNNER_TEMP/iste-dev.dump"

      - name: Upload to isolated DEV directory on Drive
        shell: bash
        run: |
          set -euo pipefail
          rclone --config "$RUNNER_TEMP/rclone.conf" copyto \
            "$RUNNER_TEMP/$BACKUP_FILE" "iste_drive:DEV/$BACKUP_FILE" --retries 3
          rclone --config "$RUNNER_TEMP/rclone.conf" lsf "iste_drive:DEV/" | grep -Fx "$BACKUP_FILE"
          echo "DEV encrypted archive is present on Drive."
      - name: Remove credentials and temporary files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rclone.conf" "$RUNNER_TEMP/passphrase" \
            "$RUNNER_TEMP/iste-dev.dump" "$RUNNER_TEMP"/*.dump.gpg \
            "$RUNNER_TEMP/decrypted.sha" "$RUNNER_TEMP/source.sha"

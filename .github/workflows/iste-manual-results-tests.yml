name: Validate Tournament V2 Manual Results
on:
  pull_request:
    paths:
      - "api/lib/tournamentManualResults.js"
      - "tests/tournamentManualResults.test.js"
      - ".github/workflows/iste-manual-results-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/tournamentManualResults.test.js
